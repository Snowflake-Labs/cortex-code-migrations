[project]
name = "migration-ai-tools"
version = "1.0.0"
description = "AI Migrator tools for migration skills — test generation, test execution, and rule management"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Full ai-migrator wheel — provides migrate CLI, run_migration_tests CLI,
    # orchestrator scripts (test_artifact_utils, rule_repository, etc.)
    "ai-migrator",
]

[tool.uv.sources]
ai-migrator = { url = "https://sctoolsartifacts.z5.web.core.windows.net/linux/beta/plugins/wheels/ai_migrator-0.5.5-py3-none-any.whl" }

# To load ai-migrator from a local git checkout instead of the bundled wheel,
# comment out the line above and uncomment the line below, adjusting the path:
# ai-migrator = { path = "../../../../../ai-migrator", editable = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
