[project]
name = "migration-mcp-python-deps"
version = "0.1.0"
description = "Python dependencies for the rule benchmark harness. The MCP server no longer embeds Python — it reaches Snowflake through the scai CLI."
requires-python = ">=3.11"
dependencies = [
    "snowflake-snowpark-python>=1.20",
    "mcp>=1.28.1,<2",
]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.30",
    "snowflake-connector-python>=4.7.1",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
