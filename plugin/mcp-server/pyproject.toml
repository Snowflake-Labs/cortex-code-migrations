[project]
name = "migration-mcp-python-deps"
version = "0.1.0"
description = "Python runtime dependencies for the migration MCP server (Snowpark)"
requires-python = ">=3.11"
dependencies = [
    "snowflake-snowpark-python>=1.20",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
